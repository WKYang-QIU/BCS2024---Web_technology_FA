<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Report - QIU Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="main-nav"></header>

<main>
    <h2>Submit a Report</h2>

    <div class="form-container">
        <div class="form-group">
            <label for="f-title">Title</label>
            <input type="text" id="f-title" placeholder="e.g. Blue Umbrella" maxlength="255">
        </div>

        <div class="form-group">
            <label for="f-desc">Description</label>
            <textarea id="f-desc" placeholder="Describe the item in detail..."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="f-category">Category</label>
                <select id="f-category">
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>
            </div>
            <div class="form-group">
                <label for="f-date">Date</label>
                <input type="date" id="f-date">
            </div>
        </div>

        <div class="form-group">
            <label for="f-location">Location</label>
            <input type="text" id="f-location" placeholder="e.g. Library Level 2">
        </div>

        <div class="form-group">
            <label for="f-contact">Contact Info</label>
            <input type="text" id="f-contact" placeholder="Email or phone number">
        </div>

        <div class="error-msg" id="form-error"></div>
        <div class="success-msg" id="form-success">Report submitted successfully!</div>

        <button class="btn btn-primary" onclick="submitReport()">Submit Report</button>
    </div>
</main>

<footer id="main-footer"></footer>


<script src="script.js" defer></script>


<!-- Dashboard Modal -->
<div id="dashboard-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; padding:20px;">
    <div id="dashboard-content" style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; max-width:560px; width:100%; max-height:80vh; overflow-y:auto;">
    </div>
</div>
</body>
</html>
