<!-- Item Detail Modal -->
<div id="item-modal"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; padding:20px;">
    <div id="modal-content"
        style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:24px; max-width:500px; width:100%; max-height:80vh; overflow-y:auto;">
    </div>
</div>

<!-- My Dashboard Modal -->
<div id="dashboard-modal"
    style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:1000; align-items:center; justify-content:center; padding:20px;">
    <div id="dashboard-content"
        style="background:var(--bg-card); border:1px solid var(--border-color); border-radius:12px; padding:24px; max-width:560px; width:100%; max-height:80vh; overflow-y:auto;">
    </div>
</div>
