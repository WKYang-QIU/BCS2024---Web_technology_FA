<!DOCTYPE html>
<html lang="en">
<head>

    <title>Lost Items - QIU Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>QIU Campus Lost & Found</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="lost.html" class="active">Lost Items</a>
        <a href="found.html">Found Items</a>
        <a href="report.html">Submit Report</a>
    </nav>
</header>

<main>
    <div class="section-header">

        <a href="report.html?category=Lost" class="btn btn-primary">+ Report Lost Item</a>

    <table>

            <tr><td colspan="7" class="empty">Loading...</td></tr>
        </tbody>
    </table>

<script src="script.js"></script>
<script>
    loadItemsByCategory('Lost');
</script>
