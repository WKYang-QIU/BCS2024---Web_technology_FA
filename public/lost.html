<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost Items - QIU Lost & Found</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header id="main-nav"></header>

    <main>
        <div class="section-header">
            <h2>Lost Items</h2>
            <a href="report.html?category=Lost" class="btn btn-primary">+ Report Lost Item</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Location</th>
                    <th>Date</th>
                    <th>Contact</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="items-tbody">
                <tr>
                    <td colspan="7" class="empty">Loading...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <footer id="main-footer"></footer>


    <script src="script.js" defer></script>

</body>

</html>
