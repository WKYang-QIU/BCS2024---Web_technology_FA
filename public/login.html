<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QIU Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>QIU <span>Lost & Found</span></h2>
    <p>Please login to continue</p>

    <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username">
    </div>

    <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
    </div>

    <div class="error-msg" id="login-error"></div>

    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="login()">Login</button>
</div>

<script>
    // If already logged in, redirect to home
    fetch('/api/auth/check')
        .then(r => r.json())
        .then(json => { if (json.success) window.location.href = 'index.html'; });

    async function login() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'none';

        if (!username) return showError('Username is required.');
        if (!password) return showError('Password is required.');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const json = await res.json();
            if (json.success) {
                window.location.href = 'index.html';
            } else {
                showError(json.message);
            }
        } catch {
            showError('Server error. Please try again.');
        }
    }

    function showError(msg) {
        const el = document.getElementById('login-error');
        el.textContent = msg;
        el.style.display = 'block';
    }

    // Allow pressing Enter to login
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') login();
    });
</script>
</body>
</html>
