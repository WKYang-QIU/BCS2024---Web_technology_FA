<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - QIU Lost & Found</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-box">
            <h2>QIU <span>Lost & Found</span></h2>
            <p>Please login to continue</p>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <div class="error-msg" id="login-error"></div>

            <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="login()">Login</button>
            <div style="margin-top:16px; text-align:center;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
                    <hr style="flex:1; border-color:var(--border-color);">
                    <span style="color:var(--text-secondary); font-size:0.8rem;">or</span>
                    <hr style="flex:1; border-color:var(--border-color);">
                </div>
                <a href="/api/auth/google" style="display:flex; align-items:center; justify-content:center; gap:10px;
            padding:9px 16px; border:1px solid var(--border-color); border-radius:6px;
            color:var(--text-primary); text-decoration:none; font-size:0.875rem;
            background:var(--bg-hover); transition:border-color 0.15s;"
                    onmouseover="this.style.borderColor='var(--border-hover)'"
                    onmouseout="this.style.borderColor='var(--border-color)'">
                    <svg width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                        <path fill="#FBBC05"
                            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </svg>
                    Continue with Google
                </a>
            </div>
            <p style="text-align:center; margin-top:14px; font-size:0.82rem;">
                <a href="#" onclick="showForgot()" style="color:var(--accent); text-decoration:none;">Forgot
                    password?</a>
            </p>

        </div>
    </div>

    <!-- Forgot Password Box -->
    <div class="login-wrapper" id="forgot-wrapper" style="display:none;">
        <div class="login-box" id="forgot-box" style="display:block;" style="display:none;">
            <h2>QIU <span>Lost & Found</span></h2>
            <p>Reset your password</p>

            <div class="form-group">
                <label for="reset-username">Username / Email</label>
                <input type="text" id="reset-username" placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="reset-password">New Password</label>
                <input type="password" id="reset-password" placeholder="Min 6 characters">
            </div>
            <div class="form-group">
                <label for="reset-confirm">Confirm Password</label>
                <input type="password" id="reset-confirm" placeholder="Repeat new password">
            </div>

            <div class="error-msg" id="reset-error"></div>
            <div class="success-msg" id="reset-success">Password reset successfully!</div>

            <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="resetPassword()">Reset
                Password</button>
            <div style="margin-top:16px; text-align:center;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:16px;">
                    <hr style="flex:1; border-color:var(--border-color);">
                    <span style="color:var(--text-secondary); font-size:0.8rem;">or</span>
                    <hr style="flex:1; border-color:var(--border-color);">
                </div>
                <a href="/api/auth/google" style="display:flex; align-items:center; justify-content:center; gap:10px;
            padding:9px 16px; border:1px solid var(--border-color); border-radius:6px;
            color:var(--text-primary); text-decoration:none; font-size:0.875rem;
            background:var(--bg-hover); transition:border-color 0.15s;"
                    onmouseover="this.style.borderColor='var(--border-hover)'"
                    onmouseout="this.style.borderColor='var(--border-color)'">
                    <svg width="18" height="18" viewBox="0 0 48 48">
                        <path fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                        <path fill="#4285F4"
                            d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
                        <path fill="#FBBC05"
                            d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
                        <path fill="#34A853"
                            d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
                    </svg>
                    Continue with Google
                </a>
            </div>
            <p style="text-align:center; margin-top:14px; font-size:0.82rem;">
                <a href="#" onclick="showLogin()" style="color:var(--accent); text-decoration:none;">← Back to Login</a>
            </p>
        </div>

        <script>
            function showForgot() {
                document.getElementById('forgot-wrapper').style.display = 'flex';
                document.querySelector('.login-wrapper').style.display = 'none';
            }

            function showLogin() {
                document.getElementById('forgot-wrapper').style.display = 'none';
                document.querySelector('.login-wrapper').style.display = 'flex';
            }

            async function resetPassword() {
                const username = document.getElementById('reset-username').value.trim();
                const password = document.getElementById('reset-password').value;
                const confirm = document.getElementById('reset-confirm').value;
                const errorEl = document.getElementById('reset-error');
                const successEl = document.getElementById('reset-success');
                errorEl.style.display = 'none';
                successEl.style.display = 'none';

                if (!username) { errorEl.textContent = 'Username is required.'; errorEl.style.display = 'block'; return; }
                if (!password || password.length < 6) { errorEl.textContent = 'Password must be at least 6 characters.'; errorEl.style.display = 'block'; return; }
                if (password !== confirm) { errorEl.textContent = 'Passwords do not match.'; errorEl.style.display = 'block'; return; }

                try {
                    const res = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const json = await res.json();
                    if (json.success) {
                        successEl.style.display = 'block';
                        setTimeout(() => showLogin(), 1500);
                    } else {
                        errorEl.textContent = json.message;
                        errorEl.style.display = 'block';
                    }
                } catch {
                    errorEl.textContent = 'Server error. Please try again.';
                    errorEl.style.display = 'block';
                }
            }

            // Load footer
            fetch('/footer.html').then(r => r.text()).then(html => {
                const footer = document.getElementById('main-footer');
                if (footer) footer.innerHTML = html;
            });

            // If already logged in, redirect to home
            fetch('/api/auth/check')
                .then(r => r.json())
                .then(json => { if (json.success) window.location.href = 'index.html'; });

            async function login() {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const errorEl = document.getElementById('login-error');
                errorEl.style.display = 'none';

                if (!username) return showError('Username is required.');
                if (!password) return showError('Password is required.');

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    const json = await res.json();
                    if (json.success) {
                        window.location.href = 'index.html';
                    } else {
                        showError(json.message);
                    }
                } catch {
                    showError('Server error. Please try again.');
                }
            }

            function showError(msg) {
                const el = document.getElementById('login-error');
                el.textContent = msg;
                el.style.display = 'block';
            }

            // Allow pressing Enter to login
            document.addEventListener('keydown', e => {
                if (e.key === 'Enter') login();
            });
        </script>
    </div>
    <footer id="main-footer"></footer>
</body>

</html>
